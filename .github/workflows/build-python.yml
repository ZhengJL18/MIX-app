name: Build Python 3.12 ARM64 for MIX

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Termux packages
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git
          cd termux-packages
          # 切到 Python 3.12 还是当前版本的时期
          git checkout $(git rev-list -1 --before="2024-12-01" HEAD)

      - name: Build Python 3.12 for aarch64
        run: |
          cd termux-packages
          # Termux 的 Docker 编译
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 python

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: python-3.12-aarch64-deb
          path: termux-packages/debs/python_*.deb
