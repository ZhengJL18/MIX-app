# Build APK and publish GitHub Release on every push to master.
# The tablet app checks the latest release on startup and self-updates.
name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # release 构建：用仓库内的 mix-release.jks 固定签名（debug/release 同签名，
      # 覆盖安装不丢数据）。--build-number 用 github.run_number 单调递增 →
      # versionCode 每次 push 必升，App 端据此检测到新版本。
      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # push 才发 release（PR 只构建验证不发布）。
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0+${{ github.run_number }}
          name: MIX v1.0.0+${{ github.run_number }}
          body: |
            自动构建发布（commit ${{ github.sha }}）

            ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
